name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # ---------------------------------------------------------------------
  # Formatting, vet, tests. The race detector is not optional here: aegis
  # holds credentials in shared state across concurrent requests.
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' in src/"
            diff -u go.mod.bak go.mod || true
            diff -u go.sum.bak go.sum || true
            exit 1
          fi
          rm go.mod.bak go.sum.bak

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
          echo "Total coverage: $total"
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/aegis .

      - name: Smoke test the binary
        run: |
          /tmp/aegis version
          /tmp/aegis --help > /dev/null
          # A password hash must round-trip through the config parser.
          hash="$(printf 'correct-horse-battery' | /tmp/aegis hashpw)"
          cat > /tmp/smoke.yaml <<EOF
          server:
            public_url: "https://aegis.example.com"
          users:
            - name: ci
              password: "$hash"
              secrets:
                tok: "a-secret-value-long-enough"
              targets:
                - id: example
                  description: "Example target"
                  base_url: "https://api.example.com"
                  methods: [GET]
                  paths: ["/v1/**"]
                  inject:
                    headers:
                      Authorization: "Bearer \${tok}"
          EOF
          /tmp/aegis validate /tmp/smoke.yaml

      - name: Reject an invalid config
        run: |
          # A base_url in a private range must never load: that would turn
          # aegis into an SSRF proxy into the host network.
          cat > /tmp/bad.yaml <<'EOF'
          server:
            public_url: "https://aegis.example.com"
          users:
            - name: ci
              password: pw
              targets:
                - id: internal
                  description: internal
                  base_url: "http://192.168.1.1"
          EOF
          if /tmp/aegis validate /tmp/bad.yaml; then
            echo "::error::a private base_url was accepted"
            exit 1
          fi
          echo "invalid config correctly rejected"

  # ---------------------------------------------------------------------
  # Known vulnerabilities in dependencies and in the standard library.
  # A tool whose job is protecting credentials should fail loudly here
  # rather than warn.
  #
  # Run as plain steps rather than through golang/govulncheck-action: the
  # action's inputs are easy to get wrong, it brings its own checkout and
  # setup-go that do not know about src/, and pinning the Go version here
  # is what keeps the standard-library findings meaningful.
  # ---------------------------------------------------------------------
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  # ---------------------------------------------------------------------
  # The image has to build, and the binary inside it has to run.
  # ---------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aegis:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image
        run: |
          docker run --rm aegis:ci version
          # distroless has no shell, so the config arrives as a mount.
          cat > "$RUNNER_TEMP/config.yaml" <<'EOF'
          server:
            public_url: "https://aegis.example.com"
          users:
            - name: ci
              password: "a-password"
              targets:
                - id: example
                  description: "Example target"
                  base_url: "https://api.example.com"
                  paths: ["/**"]
          EOF
          docker run --rm -v "$RUNNER_TEMP/config.yaml:/etc/aegis/config.yaml:ro" \
            aegis:ci validate /etc/aegis/config.yaml

      - name: Start the container and check it answers
        run: |
          docker run -d --name aegis-ci -p 2019:2019 \
            -v "$RUNNER_TEMP/config.yaml:/etc/aegis/config.yaml:ro" \
            -e AEGIS_PUBLIC_URL=http://localhost:2019 \
            --read-only --cap-drop ALL \
            aegis:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:2019/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:2019/healthz
          curl -fsS http://localhost:2019/.well-known/oauth-authorization-server | grep -q '"issuer"'

          # The embedded icon must be served: MCP clients use it for the
          # connector, and a missing one is a silent regression.
          type="$(curl -fsS -o /dev/null -w '%{content_type}' http://localhost:2019/favicon.ico)"
          if [ "$type" != "image/png" ]; then
            echo "::error::/favicon.ico returned $type, expected image/png"
            exit 1
          fi

          # Unauthenticated MCP access must be refused.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2019/mcp -d '{}')"
          if [ "$code" != "401" ]; then
            echo "::error::unauthenticated /mcp returned $code, expected 401"
            docker logs aegis-ci
            exit 1
          fi

          # ...but a foreign Origin must not be, or hosted clients break.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:2019/mcp \
            -H 'Origin: https://claude.ai' -d '{}')"
          if [ "$code" = "403" ]; then
            echo "::error::a foreign Origin was refused without allowed_origins set"
            exit 1
          fi
          echo "origin policy and auth behave as expected"

      - name: Container logs
        if: always()
        run: docker logs aegis-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f aegis-ci || true
