name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"

  # Two registries, one image. ghcr.io and Docker Hub are peers here rather
  # than primary and mirror: a single buildx run pushes the *same digest* to
  # both, so there is no second build to pay for and no way for the two to
  # drift apart.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  # Deliberately a literal and not a secret. A secret used inside
  # metadata-action's "images" input gets masked in that action's own
  # outputs, and the tag list it hands to build-push-action turns into a row
  # of asterisks. A namespace is not a secret anyway.
  DOCKERHUB_IMAGE: docker.io/andreaskasper/aegis
  DOCKERHUB_REPO: andreaskasper/aegis

jobs:
  # Never publish an image whose tests did not pass. The full CI suite runs
  # separately; this repeats the fast part as a gate.
  gate:
    name: Test before publishing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  publish:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-main.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No "registry:" - login-action defaults to Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Two images in, one tag list out: every tag below is emitted once
          # per registry, and build-push-action pushes them all from a single
          # build.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          # We set :latest ourselves below; without this the action adds its
          # own and the build command carries the tag twice.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=aegis
            org.opencontainers.image.description=A secrets firewall for LLM agents - an MCP server that performs authenticated HTTP requests without exposing the credentials
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Andreas Kasper

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT=${{ steps.version.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # A signed statement of where the image came from, for a container that
      # will be handed real credentials.
      #
      # One step per registry: the action writes its Sigstore bundle through
      # the OCI referrers API, and that call is addressed to a single image
      # name. Same digest both times - it is one artifact in two places.
      - name: Attest provenance (ghcr.io)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (Docker Hub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Docker Hub shows whatever was last uploaded, forever. Syncing it from
      # a file in the repository is the only way it stays true - and that file
      # is written for a Hub visitor rather than copied from the GitHub
      # README, which is full of links that only resolve on GitHub.
      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: "Secrets firewall for LLM agents - an MCP server that calls your APIs without exposing credentials"
          readme-filepath: ./.docker/README.md

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: publish
    # A weekly rebuild is dispatched on the release tag so that `latest` picks
    # up base-image patches. That dispatch must not try to cut the release a
    # second time: `gh release create` fails on a tag that already has one,
    # and both the primary call and its `||` fallback would go red.
    if: github.ref_type == 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Container image

          Published to both registries from the same build, same digest:

          \`\`\`
          docker pull ghcr.io/andreaskasper/aegis:${VERSION}
          docker pull andreaskasper/aegis:${VERSION}
          \`\`\`

          linux/amd64 and linux/arm64. Digest \`${DIGEST}\`.
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            --title "aegis ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag || \
          gh release create "${GITHUB_REF_NAME}" \
            --title "aegis ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
