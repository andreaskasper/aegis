# aegis behind Traefik with Let's Encrypt
#
#   cp .env.example .env      and fill it in
#   cp ../../config.example.yaml config.yaml   and edit it
#   docker compose up -d
#
# aegis publishes no port: only Traefik can reach it, over the internal
# network. Everything from the outside arrives on 443 and is terminated by
# Traefik.

name: aegis

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Uncomment while testing, so a broken setup does not burn the
      # Let's Encrypt rate limit:
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch for container labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge

  aegis:
    image: ghcr.io/andreaskasper/aegis:latest
    restart: unless-stopped

    # Deliberately no "ports:" - aegis must not be reachable except through
    # Traefik. If you publish 2019 here, you have a plaintext OAuth endpoint
    # on the open internet.

    environment:
      # This has to be the public URL, not the container address: every
      # OAuth redirect is derived from it.
      AEGIS_PUBLIC_URL: https://${AEGIS_HOST}
      AEGIS_LOG_LEVEL: ${AEGIS_LOG_LEVEL:-info}
      # Secrets referenced as env: in config.yaml
      LEXWARE_TOKEN: ${LEXWARE_TOKEN:-}
      GITHUB_PAT: ${GITHUB_PAT:-}

    volumes:
      - ./config.yaml:/etc/aegis/config.yaml:ro

    # aegis never writes to disk, so it can run fully locked down.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    networks:
      - edge

    labels:
      traefik.enable: "true"
      traefik.http.routers.aegis.rule: "Host(`${AEGIS_HOST}`)"
      traefik.http.routers.aegis.entrypoints: websecure
      traefik.http.routers.aegis.tls.certresolver: le
      traefik.http.services.aegis.loadbalancer.server.port: "2019"
      # Health check so Traefik stops routing to a container that is not
      # serving yet.
      traefik.http.services.aegis.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.aegis.loadbalancer.healthcheck.interval: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:

volumes:
  letsencrypt:
